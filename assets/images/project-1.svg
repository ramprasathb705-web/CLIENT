<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Aura Accessible Design System UI components preview">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#p1Grad)" rx="12"/>
  <!-- Window frame -->
  <rect x="20" y="20" width="600" height="320" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Top bar -->
  <circle cx="45" cy="42" r="6" fill="#ef4444"/>
  <circle cx="65" cy="42" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="42" r="6" fill="#10b981"/>
  <rect x="115" y="34" width="220" height="16" rx="4" fill="#0f172a"/>
  <text x="125" y="46" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">design-system.aura.dev/components</text>

  <!-- Sidebar -->
  <rect x="35" y="70" width="130" height="250" rx="6" fill="#0f172a"/>
  <rect x="45" y="85" width="80" height="12" rx="3" fill="#38bdf8"/>
  <rect x="45" y="110" width="100" height="8" rx="2" fill="#475569"/>
  <rect x="45" y="130" width="90" height="8" rx="2" fill="#475569"/>
  <rect x="45" y="150" width="105" height="8" rx="2" fill="#2563eb"/>
  <rect x="45" y="170" width="75" height="8" rx="2" fill="#475569"/>
  <rect x="45" y="190" width="95" height="8" rx="2" fill="#475569"/>

  <!-- Content panel -->
  <rect x="180" y="70" width="425" height="250" rx="6" fill="#0f172a"/>
  <!-- Heading placeholder -->
  <text x="200" y="105" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">WCAG AAA Button &amp; Form Kit</text>
  <text x="200" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Keyboard navigable, screen-reader verified components</text>
  
  <!-- Interactive buttons mock -->
  <rect x="200" y="150" width="110" height="38" rx="6" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
  <text x="220" y="174" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Primary CTA</text>

  <rect x="325" y="150" width="110" height="38" rx="6" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="343" y="174" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Secondary</text>

  <!-- Tag / Badge -->
  <rect x="450" y="150" width="70" height="38" rx="6" fill="#059669"/>
  <text x="462" y="174" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">4.5:1 +</text>

  <!-- Mock Input with visible focus ring -->
  <rect x="200" y="215" width="235" height="40" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <text x="215" y="240" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Focus state: 3px indicator</text>
  
  <!-- Accessibility score badge -->
  <rect x="460" y="210" width="125" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="475" y="235" fill="#10b981" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">100 / 100</text>
  <text x="475" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Lighthouse A11y</text>
</svg>
